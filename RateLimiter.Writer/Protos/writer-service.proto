syntax = "proto3";

option csharp_namespace = "RateLimiter.Writer.Api.Contracts";

package writer;

import "google/protobuf/empty.proto";

service Writer {
  rpc CreateLimit (CreateLimitRequest) returns (RateLimitResponse);
  rpc GetLimitByRoute (GetLimitByRouteRequest) returns (RateLimitResponse);
  rpc UpdateLimit (UpdateLimitRequest) returns (RateLimitResponse);
  rpc DeleteLimit (DeleteLimitRequest) returns (google.protobuf.Empty);
}

message CreateLimitRequest {
  string route = 1;
  int32 requests_per_minute = 2;
}

message GetLimitByRouteRequest {
  string route = 1;
}

message UpdateLimitRequest {
  string route = 1;
  int32 requests_per_minute = 2;
}

message DeleteLimitRequest {
  string route = 1;
}

message RateLimitResponse {
  string route = 1;
  int32 requests_per_minute = 2;
}