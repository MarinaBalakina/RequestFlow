services:
  mongodb:
    image: mongo:8.0
    container_name: rate-limiter-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - writer-mongodb-rs-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { if (rs.status().myState !== 1) quit(1); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1); }",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  writer-mongodb-rs-data: